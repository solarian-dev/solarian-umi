[project]
name = "solarian-umi"
version = "0.1.0"
description = "Run and train a UMI diffusion policy. Each task is a yaml in the project's conf/."
authors = [
    {name = "Raul Garreta", email = "raul@solarian.dev"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.10"
dependencies = [
    "solarian>=0.1.0",
    "numpy",
    "scipy",
    "opencv-python",
    "pyyaml",
]

[project.entry-points."solarian.skills"]
umi = "solarian_umi.skill:UMISkill"

[project.entry-points."solarian.services"]
umi-policy = "solarian_umi.service:UmiPolicyService"

[project.entry-points."solarian.trainers"]
umi = "solarian_umi.trainer:UmiTrainer"

[project.entry-points."solarian.commands"]
umi-slam = "solarian_umi.commands.slam:UmiSlamCommand"
umi-calibrate-lumi = "solarian_umi.commands.calibrate_lumi:UmiCalibrateLumiCommand"
calibrate-umi-camera = "solarian_umi.commands.calibrate_umi_camera:CalibrateUmiCameraCommand"

[project.optional-dependencies]
slam = [
    "click",
    "av",
    "pandas",
    "zarr",
    "numcodecs",
    "imagecodecs",
    "tqdm",
]
train = [
    "torch",
    "torchvision",
    "diffusers",
    "timm",
    "hydra-core",
    "omegaconf",
    "accelerate",
    "wandb",
    "einops",
    "dill",
    "zarr",
    "numcodecs",
    "imagecodecs",
    "pandas",
    "numba",
    "tqdm",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solarian_umi*"]

[tool.setuptools.package-data]
solarian_umi = [
    "templates/skills/*.yaml",
    "templates/training/*.yaml",
    "slam/LICENSE.umi",
    "diffusion_policy/LICENSE.umi",
    "slam/calibration/*",
    "umi/umi_gold_camera0_rgb_t0.png",
]
