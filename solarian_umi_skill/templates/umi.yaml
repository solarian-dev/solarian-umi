# UMISkill configuration.
#
# solarian install copies this to conf/umi.yaml. Copy the file again
# (conf/cup_arrange.yaml, conf/pick_lego.yaml, ...) for each policy, then
# start the skill with that filename:
#   UMISkill(params={"config": "cup_arrange.yaml"})
# Serve its checkpoint with:
#   solarian run-policy umi --config cup_arrange.yaml
# Any key here can be overridden by the same key in the skill's params.

# ---- Policy server ---------------------------------------------------
policy_server_url: ${deployment.policy_server_url}

policy_server:
  managed: false
  # The trained UMI checkpoint, as a path on the inference host.
  checkpoint: ${deployment.policy_checkpoint}
  host: 127.0.0.1
  port: 8001

connect_retries: 30
retry_interval: 1.0

# ---- Skill loop ------------------------------------------------------
frequency: 10.0

# ---- Robot wiring ----------------------------------------------------
arm: right_arm
camera: right_wrist_camera
gripper: right_gripper

arm_action_fields: [x, y, z, rx, ry, rz]
gripper_action_field: gripper

# Policy I/O is UMI metres (eval_real.py max_gripper_width = 0.09): a 40 mm
# grasp stays 40 mm, clipped to the trained range and to this physical max
# (85 mm fully open). Aperture -> servo is the gripper module's aperture_table,
# not a mapping this skill owns.
# over_grip: extra close/open in mm after the policy command (UMI driver).
# Negative closes more than commanded; obs is inverted so the policy still sees
# the width it asked for. Teleop is unaffected. Re-tune on hardware after
# recording an aperture_table: part of the old -6 mm was absorbing the error in
# the straight-line map it replaces, so expect it to shrink toward zero.
gripper_calibration:
  min_gripper_width: 0.0
  max_gripper_width: 85.0
  policy_min_width_m: 0.0
  policy_max_width_m: 0.09
  # over_grip: -6.0
  over_grip: -4.0

# ---- Motion control --------------------------------------------------
# Cartesian speed caps live on the arm module (right_arm.yaml max_speed), which
# is what the trajectory interpolator actually enforces. UMI carried them in the
# eval config; here that would be a second copy nothing reads.
execution_speed_scale: 1.5
# Infer every N policy steps (N / frequency seconds). UMI cup eval: 16.
# The predicted chunk is longer (horizon × execution_speed_scale), so the
# unused tail is replaced by the next inference.
steps_per_inference: 12
discard_actions: false

# ---- Observation history ---------------------------------------------
# Observation latencies are not here. Each module subtracts its own
# receive_latency when it stamps a reading, so the timestamps this skill sees
# already name the instant the reading was true -- and the recorder sees the
# same corrected stamps, which a skill-local copy could never give it.
# Measured by `solarian calibrate-arm` / `calibrate-gripper` /
# `calibrate-camera-latency`, each writing its own conf/<module>.yaml.
camera_down_sample_steps: 1
arm_down_sample_steps: 1
gripper_down_sample_steps: 1

# This skill warps the observation into the GoPro plane before cropping, so
# what reaches the crop has the aspect of remap_width/height in
# conf/right_wrist_camera.yaml, not the 4:3 the sensor captures. UMI eval's
# resize-then-center-crop then inscribes the fisheye circle in 224×224.
# Set true only as a fallback if the Pi is stuck on 16:9 1080p.
letterbox_to_square: false
no_mirror: true
mirror_swap: false

# ---- Debug -----------------------------------------------------------
# Directory dump of the exact camera0_rgb tensor sent to the policy (224×224),
# plus pre-crop masked/raw frames and a side-by-side vs the UMI eval gold PNG.
debug_image_path: .cache/umi_image_compare
debug_image_max_dumps: 5
# Default is the gold PNG shipped in solarian (GoPro Hero 10 + Max Lens Mod policy crop).
# Override with a path, or pass gold=<path> to `solarian calibrate-umi-camera`.
umi_gold_image: null

# ---- Arm collision geometry ------------------------------------------
# Where the arm may not go, which is a property of this table and this task,
# not of the arm -- so unlike the latencies it does belong beside the
# checkpoint rather than in right_arm.yaml.
arms:
  - # Table surface z in the arm's base frame. solve_table_collision lifts a
    # commanded pose until no gripper-finger keypoint sits below this, so set
    # above the real table and every grasp gets raised by the difference -- the
    # "Height: ... table clamp" log line reports how much it is lifting.
    # Measure, do not inherit: 0.0 came from UMI's eval_robots_config.yaml,
    # where -0.008 was their UR5's base frame. Teleop the fingertips down until
    # they just touch the table, read z off the StatusBoard (RightArmObs.z),
    # and put that value here raised by 2-3 mm, so the fingers stop just short
    # of the surface rather than pressing into it.
    height_threshold: 0.0
    sphere_radius: 0.1
    sphere_center: [0, -0.06, -0.185]
