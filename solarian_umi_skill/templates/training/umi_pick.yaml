# Point-and-pick training (UMISkill with targets: {bbox: bbox}): a UMI diffusion policy (ViT-L CLIP
# encoder, UNet) with the target box drawn as a 4th image channel and
# conditioned on the ViT summary (CLS) token. solarian install copies this to
# conf/training/umi_pick.yaml once; umi_pick_mask.yaml conditions on the
# object's segmentation instead.
#
#   solarian train --conf conf/training/umi_pick
#
# The datasets need a `bbox` per frame. In a .zarr.zip: run solarian_base
# scripts/track_zarr.py --backwards --save on the SLAM dataset first. In a
# .solarian.zip: episodes/*/targets/camera0.rgb.npz, in video pixels.
# Checkpoints land in models/<job_name>/checkpoints/; point umi_target.yaml's
# server.checkpoint (deployment.umi_target_policy_checkpoint) at one.
#
# Fine-tuning: set training.init_from_ckpt to an existing pick checkpoint.
# Weights only; optimizer, LR schedule and epochs restart. Train on old + new
# episodes so the recomputed normalizer and the data mix stay close to the
# original run. Budget by samples seen: exp8 saw about 17M (170 epochs x 100k
# samples at batch 512, lr 3e-4). About 3M is enough for a fine-tune. Keep
# optimizer.lr / batch_size near 1e-6 (batch 32: 3e-5 to 5e-5), checkpoint
# every epoch (training.checkpoint_every: 1, training.sample_every: 1) and
# rank by checkpoint.topk.monitor_key: val_loss.

# The installed trainer plugin that runs this file (solarian.trainers).
trainer: umi
job_name: umi_pick
# Run folder: checkpoints go to <output_dir>/checkpoints/, beside
# logs.json.txt and normalizer.pkl. null is models/<job_name>. A ViT-L
# checkpoint is about 3 GB (6 GB with resume, which also saves the optimizer).
output_dir: null
# solarian modal-train settings (gpu_type, gpus, volume, profile, ...).
# null: local training only.
modal: null

# Everything below is the UMI training config, as `python train.py
# --config-name` reads it in the UMI repo.
#
# Adapted from Universal Manipulation Interface.
# Copyright (c) 2023 Columbia Artificial Intelligence and Robotics Lab.
# https://github.com/real-stanford/universal_manipulation_interface
# Licensed under the MIT License. The full text is LICENSE.umi
# beside this package.

name: train_diffusion_unet_timm
_target_: solarian_umi_skill.diffusion_policy.workspace.train_diffusion_unet_image_workspace.TrainDiffusionUnetImageWorkspace

# The task, UMI's task/umi_pick_bbox.yaml inlined.
task:
  name: umi_pick_lego

  camera_obs_latency: 0.125
  robot_obs_latency: 0.0001
  gripper_obs_latency: 0.02
  dataset_frequeny: 0 #59.94
  obs_down_sample_steps: 3 # 3, 1

  low_dim_obs_horizon: 2
  img_obs_horizon: 1
  action_horizon: 16
  ignore_proprioception: False

  shape_meta: &shape_meta
    # acceptable types: rgb, low_dim
    obs:
      camera0_rgb:
        shape: [3, 224, 224]
        horizon: ${task.img_obs_horizon} # int
        latency_steps: 0 # float
        down_sample_steps: ${task.obs_down_sample_steps} # int
        type: rgb
        ignore_by_policy: False
      robot0_eef_pos:
        shape: [3]
        horizon: ${task.low_dim_obs_horizon} # int
        latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency}) * ${task.dataset_frequeny}'} # float
        down_sample_steps: ${task.obs_down_sample_steps} # float
        type: low_dim
        ignore_by_policy: ${task.ignore_proprioception}
      # robot0_eef_pos_abs:
      #   shape: [1]
      #   axis: [2] # 2 means z-axis
      #   horizon: ${task.low_dim_obs_horizon} # int
      #   latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency}) * ${task.dataset_frequeny}'} # float
      #   down_sample_steps: ${task.obs_down_sample_steps} # float
      #   type: low_dim
      # robot0_eef_rot_axis_angle_abs:
      #   shape: [2]
      #   axis: [0, 1] # yaw and pitch
      #   horizon: ${task.low_dim_obs_horizon} # int
      #   latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency}) * ${task.dataset_frequeny}'} # float
      #   down_sample_steps: ${task.obs_down_sample_steps} # float
      #   type: low_dim
      robot0_eef_rot_axis_angle:
        raw_shape: [3]
        shape: [6]
        horizon: ${task.low_dim_obs_horizon} # int
        latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency}) * ${task.dataset_frequeny}'} # float
        down_sample_steps: ${task.obs_down_sample_steps} # float
        type: low_dim
        rotation_rep: rotation_6d
        ignore_by_policy: ${task.ignore_proprioception}
      robot0_gripper_width:
        shape: [1]
        horizon: ${task.low_dim_obs_horizon} # int
        latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.gripper_obs_latency}) * ${task.dataset_frequeny}'} # float
        down_sample_steps: ${task.obs_down_sample_steps} # float
        type: low_dim
        ignore_by_policy: ${task.ignore_proprioception}
      # Target box [x0, y0, x1, y1] in pixels of camera0_rgb, the `bbox` array
      # of the zarr (solarian_base scripts/track_zarr.py --save writes it). It
      # shares the camera clock, so latency_steps stays 0.
      #   low_dim:      the 4 scalars join the encoder features (legacy).
      #   mask_channel: rasterized to a 4th image channel of the ViT patch
      #                 embed, zero-initialized; horizon must match the image.
      bbox:
        shape: [4]
        horizon: 1
        latency_steps: 0
        down_sample_steps: ${task.obs_down_sample_steps}
        type: low_dim
        ignore_by_policy: False
        bbox_mode: mask_channel
        target_rgb_key: camera0_rgb

      # pose with respect to episode start
      # robot0_eef_pos_wrt_start:
      #   shape: [3]
      #   horizon: ${task.low_dim_obs_horizon} # int
      #   latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency}) * ${task.dataset_frequeny}'} # float
      #   down_sample_steps: ${task.obs_down_sample_steps} # float
      #   type: low_dim
      #   ignore_by_policy: ${task.ignore_proprioception}
      robot0_eef_rot_axis_angle_wrt_start:
        raw_shape: [3]
        shape: [6]
        horizon: ${task.low_dim_obs_horizon} # int
        latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency}) * ${task.dataset_frequeny}'} # float
        down_sample_steps: ${task.obs_down_sample_steps} # float
        type: low_dim
        ignore_by_policy: ${task.ignore_proprioception}
    action: 
      shape: [10]
      horizon: ${task.action_horizon}
      latency_steps: 0 # float
      down_sample_steps: ${task.obs_down_sample_steps} # int
      rotation_rep: rotation_6d

  task_name: &task_name umi
  # The datasets: a .solarian.zip session, a session directory or a
  # .zarr.zip. Each sample is drawn from entry i with probability
  # weight_i / sum(weights), whatever its size; validation comes from the
  # first unless dataset.val_dataset_path is set.
  dataset_path: ${task.dataset_mix[0].path}
  dataset_mix:
    - path: datasets/pick_session/dataset.solarian.zip
      weight: 1.0
  # Samples per epoch, drawn by weight. null: as many as the datasets hold
  # together. An epoch is samples_per_epoch / batch_size steps and only sets
  # the cadence of validation, sampling and checkpoints; the run is
  # training.num_epochs of them.
  samples_per_epoch: null
  pose_repr: &pose_repr
    obs_pose_repr: relative # abs or rel
    action_pose_repr: relative # abs or rel or delta

  env_runner:
    _target_: solarian_umi_skill.diffusion_policy.env_runner.real_pusht_image_runner.RealPushTImageRunner

  dataset:
    _target_: solarian_umi_skill.diffusion_policy.dataset.umi_dataset.UmiDataset
    shape_meta: *shape_meta
    dataset_path: ${task.dataset_path}
    # Decoded once per machine, then copied by every GPU rank; must be local disk.
    cache_dir: /tmp/solarian_umi_cache
    pose_repr: *pose_repr
    action_padding: False
    temporally_independent_normalization: False
    repeat_frame_prob: 0.0
    max_duration: null
    seed: 42
    val_ratio: 0.05
    # Episodes kept out of the datasets, as their own dataset (target tracked,
    # mirrored like the training set). val_loss is computed on them and every
    # training episode trains. null: a random 5% of the first dataset's
    # episodes, which splits mirror twins and duplicated episodes across both.
    val_dataset_path: null

# task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"
# Per GPU.
# The exp8 run used 128 per GPU on 4 GPUs. Lower it if the GPU runs out of
# memory (packaging.yaml uses 32 on a 24 GB card).
batch_size: 32
# visual_encoder: "vit_base_patch16_clip_224.openai"
# visual_encoder_tag: "vitb"
visual_encoder: "vit_large_patch14_clip_224"
visual_encoder_tag: "vitl"
# visual_encoder: "resnet34.a1_in1k"
# visual_encoder_tag: "resnet34"
model_type: "unet"
# The workspace trains on one GPU; a tag only.
num_gpus: 1


# Parsed from the dataset file name's hyphen-separated tokens.
# eg: pick_lego-black_mirror-real_200-sim_200-no_bbox.zarr.zip
# Resolver: train.py::parse_dataset_field. Last arg is the fallback default.
# mirror options: black_mirror, mirror, swap_mirror, no_mirror
mirror: ${parse_dataset_field:${task.dataset_path},mirror,no_mirror}
# real_data_size / sim_data_size are null when the filename has no real_<N>/sim_<N>
# token; the wandb tags below skip themselves in that case.
real_data_size: ${parse_dataset_field:${task.dataset_path},real_data_size,null}
sim_data_size: ${parse_dataset_field:${task.dataset_path},sim_data_size,null}
bbox: ${parse_dataset_field:${task.dataset_path},bbox,no_bbox}
task_name: ${parse_dataset_field:${task.dataset_path},data_task,pick_lego}
# How the target reaches the policy; a wandb tag.
bbox_mode: ${task.shape_meta.obs.bbox.bbox_mode}

n_action_steps: 8

policy:
  _target_: solarian_umi_skill.diffusion_policy.policy.diffusion_unet_timm_policy.DiffusionUnetTimmPolicy

  shape_meta: ${shape_meta}
  
  noise_scheduler:
    _target_: diffusers.DDIMScheduler
    num_train_timesteps: 50
    beta_start: 0.0001
    beta_end: 0.02
    # beta_schedule is important
    # this is the best we found
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon # or sample

  obs_encoder:
    _target_: solarian_umi_skill.diffusion_policy.model.vision.timm_obs_encoder.TimmObsEncoder
    shape_meta: ${shape_meta}

    ##### from scratch #####
    # model_name: 'vit_base_patch16_224'
    # model_name: 'resnet34'
    # model_name: 'vit_tiny_patch16_224'
    # model_name: 'efficientnet_b0'
    # model_name: 'efficientnet_b3'
    # pretrained: False
    # frozen: False

    ##### from scratch #####
    # model_name: 'resnet34.a1_in1k'
    model_name: ${visual_encoder}
    # model_name: 'vit_large_patch14_clip_224'  # Changed to match checkpoint cup_wild_vit_l_1img.ckpt (ViT-L with CLIP weights)
    # model_name: 'convnext_base.clip_laion2b_augreg_ft_in12k'
    pretrained: True
    frozen: False

    
    global_pool: ''

    # 'avg' or 'max' or 'soft_attention' or 'spatial_embedding' or 'transformer' or 'attention_pool_2d'
    # null: the ViT summary (CLS) token, as the exp8 checkpoints.
    # box_pool: CLS plus the patch tokens under the target, averaged, plus
    # its bounding corners. Wider conditioning; a cls
    # training.init_from_ckpt is widened with zero weights for the new inputs.
    feature_aggregation: null
    position_encording: 'sinusoidal' # 'learnable' or 'sinusoidal'. it only works for transformer

    # it only works for resnet. 32 (7x7) or 16 (14x14)
    downsample_ratio: 32

    transforms:
      - type: RandomCrop
        ratio: 0.95
      # RandomRotation is not compatible with BF16
      # - _target_: torchvision.transforms.RandomRotation
      #   degrees:
      #     - -5.0
      #     - 5.0
      #   expand: false
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.3
        contrast: 0.4
        saturation: 0.5
        hue: 0.08
      # - _target_: torchvision.transforms.RandomPerspective
      #   distortion_scale: 0.5
      #   p: 1.0
      # - _target_: torchvision.transforms.ElasticTransform
      #   alpha: 50.0
      #   sigma: 5.0
      # - _target_: torchvision.transforms.RandomPerspective
      #   distortion_scale: 0.5
      #   p: 1.0
      # - _target_: torchvision.transforms.ElasticTransform
      #   alpha: 50.0
      #   sigma: 5.0
      # - _target_: torchvision.transforms.RandomCrop
      #   size: 192
      

    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  num_inference_steps: 16
  obs_as_global_cond: True
  diffusion_step_embed_dim: 128
  down_dims: [256,512,1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True
  input_pertub: 0.1 # reference: https://github.com/forever208/DDPM-IP
  # train multiple diffusion steps per obs encoder forward pass
  # doing this too much will cause instability!
  train_diffusion_n_samples: 1

ema:
  _target_: solarian_umi_skill.diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999 

dataloader:
  batch_size: ${batch_size}
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True
  prefetch_factor: 4

val_dataloader:
  batch_size: ${batch_size}
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True
  prefetch_factor: 4

# dataloader:
#   batch_size: 64
#   num_workers: 16
#   shuffle: True
#   pin_memory: True
#   persistent_workers: True

# val_dataloader:
#   batch_size: 64
#   num_workers: 16
#   shuffle: False
#   pin_memory: True
#   persistent_workers: True

optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  # Continue an interrupted run from <output_dir>/checkpoints/latest.ckpt at
  # its next epoch, up to num_epochs in total. init_from_ckpt is then
  # ignored.
  resume: false
  # Start from these weights with a fresh optimizer, LR schedule and epoch
  # count. null: the pretrained backbone. A cls checkpoint can start a
  # box_pool run; its conditioning is widened with zero weights.
  init_from_ckpt: null
  # optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 250
  gradient_accumulate_every: 1
  # EMA destroys performance when used with BatchNorm
  # replace BatchNorm with GroupNorm.
  use_ema: True
  freeze_encoder: False
  # training loop control
  # in epochs
  rollout_every: 10
  checkpoint_every: 10
  val_every: 1
  sample_every: 5
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0

logging:
  backend: solarian_base  # solarian_base, wandb, none, or a list
  project: umi
  mode: online
  resume: False
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags:
    - "${name}"
    - "${task_name}"
    - "${exp_name}"
    # visual encoder could be vit_base_patch16_clip_224.openai, resnet34, etc.
    - "${visual_encoder_tag}"
    # batch size for each gpu
    - "batch_size:${eval:'${batch_size} * ${num_gpus}'}"
    - "num_gpus:${num_gpus}"
    # model type could be unet or transformer
    - "${model_type}"
    # dataset file name (joined; substring-searchable on wandb)
    # Note: full ${task.dataset_path} dropped — wandb tags max 64 chars.
    - "${eval:'\"${task.dataset_path}\".split(\"/\")[-1].rsplit(\".\",1)[0]'}"
    - "${mirror}"
    # Only emit real_/sim_ tags when the dataset filename actually carries
    # a real_<N> / sim_<N> token (otherwise the resolver returns None and we
    # render an empty string here, which is filtered out before wandb init).
    - "${eval:'\"real_size:%d\" % ${real_data_size} if ${real_data_size} is not None else \"\"'}"
    - "${eval:'\"sim_size:%d\" % ${sim_data_size} if ${sim_data_size} is not None else \"\"'}"
    - "${eval:'(\"real\" if ${real_data_size} > 0 else \"no_real\") if ${real_data_size} is not None else \"\"'}"
    - "${eval:'(\"sim\" if ${sim_data_size} > 0 else \"no_sim\") if ${sim_data_size} is not None else \"\"'}"
    - "${bbox}"
    - "bbox_mode:${bbox_mode}"
    - "aggregation:${policy.obs_encoder.feature_aggregation}"
  id: null
  group: ${task_name}_${model_type}

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 20
    format_str: '{task_name}-{model_type}-{visual_encoder}-batch_{total_batch}-{dataset_file_name}-epoch_{epoch:04d}-train_loss_{train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

