# Point-and-pick: the cup config plus a target box (task/umi_pick_bbox.yaml).
# Matches the UMI train_diffusion_unet_timm_umi_pick_lego_pile_bbox.yaml run,
# so its checkpoints load with training.init_from_ckpt.

defaults:
  - train_diffusion_unet_timm_umi_cup_wild
  - override task: umi_pick_bbox
  - _self_

batch_size: 128

bbox_mode: ${task.shape_meta.obs.bbox.bbox_mode}

policy:
  obs_encoder:
    # null: the ViT summary (CLS) token, as the exp8 checkpoints.
    # box_pool: CLS plus the patch tokens under the box, averaged, plus the
    # box corners. Changes the conditioning width, so it trains from scratch
    # (or from another box_pool checkpoint).
    feature_aggregation: null

training:
  num_epochs: 250

logging:
  tags:
    - "${name}"
    - "${task_name}"
    - "${exp_name}"
    - "${visual_encoder_tag}"
    - "batch_size:${eval:'${batch_size} * ${num_gpus}'}"
    - "num_gpus:${num_gpus}"
    - "${model_type}"
    - "${eval:'\"${task.dataset_path}\".split(\"/\")[-1].rsplit(\".\",1)[0]'}"
    - "${mirror}"
    - "${eval:'\"real_size:%d\" % ${real_data_size} if ${real_data_size} is not None else \"\"'}"
    - "${eval:'\"sim_size:%d\" % ${sim_data_size} if ${sim_data_size} is not None else \"\"'}"
    - "${eval:'(\"real\" if ${real_data_size} > 0 else \"no_real\") if ${real_data_size} is not None else \"\"'}"
    - "${eval:'(\"sim\" if ${sim_data_size} > 0 else \"no_sim\") if ${sim_data_size} is not None else \"\"'}"
    - "${bbox}"
    - "bbox_mode:${bbox_mode}"
    - "aggregation:${policy.obs_encoder.feature_aggregation}"
